  <!-- 启动前置：必须在首次绘制之前执行，否则会先按静态属性画一帧再切，
       深色用户每次打开都看见一次白闪（FOUC）。
       主题现在是二维：data-theme（配色身份）× data-mode（明暗）。
       旧的单维键 lls_theme 作 legacy 迁移，读过一次后由 app.js 写入新键。
       .booting 同时前置，启动期间的过渡一并关掉，避免骨架→应用的过渡抖动。 -->
  <script>
    (function () {
      var d = document.documentElement;
      var PALS = ["glass", "amber", "paper", "ink", "night"];
      var pal = null, mode = null, legacy = null;
      try {
        pal = localStorage.getItem("lls_palette");
        mode = localStorage.getItem("lls_mode");
        legacy = localStorage.getItem("lls_theme");
      } catch (e) {}
      /* legacy 迁移：旧 light → 暖纸书桌·亮；旧 dark → 终端琥珀·暗 */
      if (legacy === "light") { if (!pal) pal = "paper"; if (!mode) mode = "light"; }
      else if (legacy === "dark") { if (!pal) pal = "amber"; if (!mode) mode = "dark"; }
      if (PALS.indexOf(pal) < 0) pal = "glass";
      if (mode !== "light" && mode !== "dark") {
        /* 未设置 或 选了「跟随系统」：此刻就问系统，避免先画错再改 */
        var sysDark = false;
        try { sysDark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); } catch (e) {}
        mode = sysDark ? "dark" : "light";
      }
      d.setAttribute("data-theme", pal);
      d.setAttribute("data-mode", mode);
      /* 移动端地址栏 / PWA 标题栏颜色 = 各主题的 --bg。
         取值与 style.css 配色表逐字一致（test_theme 有断言锁同步），
         这里内联是为了首帧就正确 —— 否则 JS 执行前地址栏会先闪一次静态色。 */
      try {
        var BG = {
          "glass:light": "#eaeefb", "glass:dark": "#0b1020",
          "amber:light": "#f1ebdd", "amber:dark": "#0e0d0a",
          "paper:light": "#faf2e9", "paper:dark": "#1c1610",
          "ink:light": "#f3f2ee", "ink:dark": "#131312",
          "night:light": "#eef1f8", "night:dark": "#0a1030"
        };
        var mc = document.querySelector('meta[name="theme-color"]');
        var hex = BG[pal + ":" + mode];
        if (mc && hex) mc.setAttribute("content", hex);
      } catch (e) {}
      /* 正文排版：也要在首帧前应用，否则打开笔记会先按默认字号排一次再跳 */
      try {
        var t = JSON.parse(localStorage.getItem("lls_type") || "null");
        if (t && typeof t === "object") {
          if (isFinite(t.fs) && t.fs > 0) d.style.setProperty("--read-fs", t.fs + "px");
          if (isFinite(t.lh) && t.lh > 0) d.style.setProperty("--read-lh", String(t.lh));
          if (isFinite(t.ls) && t.ls > 0) d.style.setProperty("--read-ls", t.ls + "px");
          if (isFinite(t.gap) && t.gap > 0) d.style.setProperty("--para-gap", t.gap + "px");
          if (isFinite(t.w) && t.w > 0) d.style.setProperty("--read-w", t.w + "px");
        }
      } catch (e) {}
      d.classList.add("booting", "js-boot");
      /* 兜底：app.js 万一异常，8s 后也必须把骨架收掉，不能永久盖住页面 */
      setTimeout(function () {
        if (d.classList.contains("js-boot")) d.classList.remove("booting", "js-boot");
      }, 8000);
    })();
  </script>
